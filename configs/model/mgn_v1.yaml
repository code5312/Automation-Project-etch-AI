# W4-01: 모델 A(MeshGraphNet) 학습 설정 1차 초안. 설계서 §3 C3(processor_size=8~15,
# hidden_dim_processor=64~128) 범위 안. processor_size=12는 임의값이 아니라 GPU 팀원이
# 전달한 MGN 초안 체크포인트(runs/mgn_draft/ckpt_mgn.pt)의 실측 레이어 수(2026-11-09,
# docs/project-checklist.md W4 역할분담 메모 참고) — 이 값이어야 해당 체크포인트를
# load_state_dict로 이어 쓸 수 있다. 이전 제안값(6)에서 변경.

seed: 20261027

data:
  dataset_hash: 4b8c0ce1bc98  # reports/evidence/W3-04_stats_dataset_hash.md

model:
  name: meshgraphnet
  meshgraphnet:
    input_dim_nodes: 14
    input_dim_edges: 3
    output_dim: 2
    processor_size: 12    # GPU 팀원 MGN 초안 체크포인트 실측값에 맞춤 [확인, 2026-11-09]
    hidden_dim_processor: 64

train:
  loss: chamfer
  epochs: 100   # [제안: 설계서 §5 예시값, 1주차 시간 예산(3시간 이내, W4-04)에서 재검토]
  lr: 0.0001    # [미확인: seed 코드/PhysicsNeMo 예제 기본값 확인 전]
