# 시뮬레이션 스윕: Indexed Job 하나가 샤드 N개를 병렬로 처리
# [확인, W1-S4] cpu:"1"로는 ViennaPS 레이트레이싱(내부 12~13스레드 사용, W1-S1에서 확인)이
# 심하게 쓰로틀링되어 30분에도 레시피 1건을 못 끝냈다. parallelism=2 기준 파드당 cpu:"6"으로 올림
# (2 파드 × 6 = 12코어, 호스트 14코어 내).
apiVersion: batch/v1
kind: Job
metadata:
  name: etch-sim-local
spec:
  completionMode: Indexed        # 파드마다 JOB_COMPLETION_INDEX(0..completions-1) 자동 주입
  completions: 4                 # 로컬 시험용: 샤드 4개
  parallelism: 2                 # 로컬 PC 사양에 맞춰 동시 2개
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: sim
          image: etch-sim:0.1     # docker/Dockerfile.sim 으로 빌드
          env:
            - { name: SIM_SHARDS, value: "4" }
            - { name: SIM_K,      value: "2" }
            - { name: SIM_RAW,    value: "/data/raw" }
          resources:
            requests: { cpu: "6", memory: "3Gi" }
            limits:   { cpu: "6", memory: "3Gi" }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: etch-data }   # 여러 노드면 ReadWriteMany 가능한 스토리지 필요
