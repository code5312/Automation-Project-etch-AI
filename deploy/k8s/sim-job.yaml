# **superseded — 더 쓰지 않음.** 이 파일의 cpu:"2"/parallelism:8은 W1-S4에서 이미 쓰로틀링 위험이
# 있다고 [미확인]으로 남겨둔 추정치였고, "실제 노드 사양 확인 후 W3-02에서 확정" 예정이었다.
# W3-02에서 probe8 실측(`reports/evidence/W3-01_probe8_depthmax_kind.md`)으로 cpu=6/parallelism=2가
# 맞는 값으로 확정됐고, 그 결과물은 이 파일을 고치는 대신 `deploy/k8s/sim-job-gen.yaml`로 새로 만들었다.
# 지금 본 데이터 생성에 쓰는 건 `sim-job-gen.yaml`이다 — 이 파일(cpu:"2")을 그대로 적용하면 안 됨.
apiVersion: batch/v1
kind: Job
metadata:
  name: etch-sim-sweep
spec:
  completionMode: Indexed        # 파드마다 JOB_COMPLETION_INDEX(0..completions-1) 자동 주입
  completions: 40                # 샤드 수 = SIM_SHARDS 와 같아야 함
  parallelism: 8                 # 동시에 도는 파드 수 (클러스터 코어 수에 맞춰 조정)
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: sim
          image: etch-sim:0.1     # docker/Dockerfile.sim 으로 빌드
          env:
            - { name: SIM_SHARDS, value: "40" }
            - { name: SIM_K,      value: "20" }
            - { name: SIM_RAW,    value: "/data/raw" }
          resources:
            requests: { cpu: "2", memory: "4Gi" }
            limits:   { cpu: "2", memory: "4Gi" }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: etch-data }   # 여러 노드면 ReadWriteMany 가능한 스토리지 필요
