# 시뮬레이션 스윕: Indexed Job 하나가 샤드 N개를 병렬로 처리  [제안, 클러스터에서 아직 실행 안 해봄]
# [확인, W1-S4] 로컬 kind 테스트(sim-job-local.yaml)에서 cpu:"2"는 너무 적어 심하게 쓰로틀링됨을
# 확인함(ViennaPS 레이트레이싱이 내부 12~13스레드 사용, W1-S1). 아래 cpu:"2"도 같은 문제가
# 있을 가능성이 높다 — 실제 클러스터 노드의 코어 수를 모르므로[미확인] 여기 숫자는 임의로
# 바꾸지 않았다. 실클러스터 확보 시 노드당 코어 수 대비 parallelism·cpu를 재조정해야 한다.
apiVersion: batch/v1
kind: Job
metadata:
  name: etch-sim-sweep
spec:
  completionMode: Indexed        # 파드마다 JOB_COMPLETION_INDEX(0..completions-1) 자동 주입
  completions: 40                # 샤드 수 = SIM_SHARDS 와 같아야 함
  parallelism: 8                 # 동시에 도는 파드 수 (클러스터 코어 수에 맞춰 조정)
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: sim
          image: etch-sim:0.1     # docker/Dockerfile.sim 으로 빌드
          env:
            - { name: SIM_SHARDS, value: "40" }
            - { name: SIM_K,      value: "20" }
            - { name: SIM_RAW,    value: "/data/raw" }
          resources:
            requests: { cpu: "2", memory: "4Gi" }
            limits:   { cpu: "2", memory: "4Gi" }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: etch-data }   # 여러 노드면 ReadWriteMany 가능한 스토리지 필요
