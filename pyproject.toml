[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etchpipe"
version = "0.1.0"
description = "식각 공정 AI 대리 모델의 검증·재학습 자동화 파이프라인"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pyvista==0.49.1",
    # W3-11에서 etl.py의 내부 경계 필터링(_filter_internal_interfaces)에 추가됐는데
    # requirements-train.txt에만 들어가고 여기(패키지 핵심 의존성)엔 안 들어가 있었다 —
    # 2026-11-13 실제 GitHub Actions pipeline-smoke job에서 `pip install -e .` 후에도
    # etl.py import 자체가 ModuleNotFoundError로 깨지는 걸 보고 발견.
    "shapely==2.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# 스파이크 1회용 코드는 스타일 규칙에서 제외한다:
#   - sim_batch.py/mgn_smoke_test.py: seed/에서 그대로 옮긴 원본 — 내용을 수정하지 않기로
#     했음(사용자 지시). 2주차 이후 정식 구현으로 교체되면서 자연히 없어질 예정.
#   - reports/evidence/의 스크립트도 스파이크 1회용 코드라 같은 이유로 제외한다.
extend-exclude = [
    "src/etchpipe/sim/sim_batch.py",
    "scripts/mgn_smoke_test.py",
    "reports/evidence",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# etchpipe가 설치돼 있지 않아도(lint 잡은 pip install -e . 을 안 함) import 정렬이
# 설치 여부에 따라 달라지지 않게 first-party로 고정한다(2026-10-28, CI lint 실패로 발견).
known-first-party = ["etchpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
