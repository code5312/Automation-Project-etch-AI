[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etchpipe"
version = "0.1.0"
description = "식각 공정 AI 대리 모델의 검증·재학습 자동화 파이프라인"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pyvista==0.49.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# 스파이크 1회용 코드는 스타일 규칙에서 제외한다:
#   - sim_batch.py/mgn_smoke_test.py: seed/에서 그대로 옮긴 원본 — 내용을 수정하지 않기로
#     했음(사용자 지시). 2주차 이후 정식 구현으로 교체되면서 자연히 없어질 예정.
#   - spike_w3_01_gpu_colab.py: Colab에 그대로 복붙할 코드 블록을 문자열로 담고 있어,
#     줄바꿈을 끼워 넣으면 복붙용 스니펫이 깨질 위험이 있음(2026-11-03 lint 검사 중 발견).
#   - reports/evidence/의 스크립트도 스파이크 1회용 코드라 같은 이유로 제외한다.
extend-exclude = [
    "src/etchpipe/sim/sim_batch.py",
    "scripts/mgn_smoke_test.py",
    "scripts/spike_w3_01_gpu_colab.py",
    "reports/evidence",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# etchpipe가 설치돼 있지 않아도(lint 잡은 pip install -e . 을 안 함) import 정렬이
# 설치 여부에 따라 달라지지 않게 first-party로 고정한다(2026-10-28, CI lint 실패로 발견).
known-first-party = ["etchpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
